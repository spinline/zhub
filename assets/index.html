<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee Merkezi</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d22; --muted: #6b7180;
    --line: #e3e5ea; --accent: #2f6fed; --accent-soft: #e6eeff;
    --warn: #c2410c; --ok: #15803d; --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1c1f25; --text: #e8eaee; --muted: #9aa0ad;
      --line: #2b2f37; --accent: #6d9bff; --accent-soft: #1f2a44;
      --warn: #fb923c; --ok: #4ade80; --chip: #262a32;
    }
  }
  * { box-sizing: border-box; }
  /* display kuralları hidden özniteliğini ezmesin */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #conn { font-size: 13px; color: var(--muted); }
  #conn.off { color: var(--warn); }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .top { display: flex; align-items: flex-start; gap: 10px; }
  .names { flex: 1; min-width: 0; }
  .name { font-weight: 600; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
  .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
  .chip.warn { color: var(--warn); }
  .values { display: flex; gap: 16px; flex-wrap: wrap; }
  .value b { font-size: 22px; font-weight: 600; }
  .value span { display: block; font-size: 12px; color: var(--muted); }
  .value.alert b { color: var(--warn); }
  label.slider { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer;
  }
  .switch span::before {
    content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .thermo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .thermo .target { font-size: 26px; font-weight: 600; min-width: 92px; text-align: center; }
  .thermo button.step { width: 40px; height: 40px; padding: 0; font-size: 20px; border-radius: 50%; }
  .thermo select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .chip.heat { color: #fff; background: var(--warn); }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  details.more { border-top: 1px solid var(--line); padding-top: 8px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 8px 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; }
  .setting { display: grid; grid-template-columns: 1fr 90px auto; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .setting input { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .setting .note { grid-column: 1 / -1; color: var(--warn); font-size: 12px; }
  .menu { display: flex; gap: 8px; }
  .menu button { padding: 4px 10px; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Zigbee Merkezi</h1>
  <span id="conn">bağlanıyor…</span>
  <button id="permit" class="primary">Cihaz ekle</button>
</header>
<main>
  <h2 id="climateTitle" hidden>Termostatlar</h2>
  <div id="climate" class="grid"></div>
  <h2>Işıklar</h2>
  <div id="lights" class="grid"></div>
  <h2>Sensörler</h2>
  <div id="sensors" class="grid"></div>
  <h2 id="otherTitle" hidden>Diğer</h2>
  <div id="other" class="grid"></div>
</main>
<div id="toast"></div>
<script>
const devices = new Map();
const cards = new Map();
let permitUntil = 0;

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(c => c != null));
  return node;
};

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(path, body, method = "POST") {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const run = (promise) => promise.catch(e => toast(e.message));

function ago(ts) {
  if (!ts) return "hiç görülmedi";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 60) return "az önce";
  if (s < 3600) return `${Math.floor(s / 60)} dk önce`;
  if (s < 86400) return `${Math.floor(s / 3600)} sa önce`;
  return `${Math.floor(s / 86400)} gün önce`;
}

function group(d) {
  const c = d.capabilities;
  if (c.includes("thermostat")) return "climate";
  if (c.includes("on_off")) return "lights";
  if (c.some(x => ["temperature", "humidity", "occupancy", "contact", "motion", "water_leak", "smoke", "alarm"].includes(x))) return "sensors";
  return "other";
}

function value(label, text, alert = false) {
  return el("div", { className: "value" + (alert ? " alert" : "") }, el("b", { textContent: text }), el("span", { textContent: label }));
}

function sensorValues(d) {
  const s = d.state, c = d.capabilities, out = [];
  if ((c.includes("temperature") || c.includes("thermostat")) && s.temperature != null) out.push(value(c.includes("thermostat") ? "Oda" : "Sıcaklık", `${s.temperature.toFixed(1)} °C`));
  if (c.includes("humidity") && s.humidity != null) out.push(value("Nem", `%${Math.round(s.humidity)}`));
  if (c.includes("occupancy") && s.occupancy != null) out.push(value("Varlık", s.occupancy ? "Var" : "Yok", s.occupancy));
  if (s.alarm != null) {
    if (c.includes("contact")) out.push(value("Kapı/pencere", s.alarm ? "Açık" : "Kapalı", s.alarm));
    else if (c.includes("motion")) out.push(value("Hareket", s.alarm ? "Algılandı" : "Yok", s.alarm));
    else if (c.includes("water_leak")) out.push(value("Su", s.alarm ? "Sızıntı!" : "Kuru", s.alarm));
    else if (c.includes("smoke")) out.push(value("Duman", s.alarm ? "Alarm!" : "Normal", s.alarm));
    else if (c.includes("alarm")) out.push(value("Alarm", s.alarm ? "Etkin" : "Normal", s.alarm));
  }
  return out;
}

function buildCard(d) {
  const card = el("div", { className: "card" });

  const name = el("button", { className: "name", title: "Yeniden adlandır" });
  name.onclick = () => {
    const current = devices.get(d.ieee);
    const next = prompt("Cihazın adı", current.name);
    if (next && next.trim() && next !== current.name) run(api(`/api/devices/${current.ieee}/rename`, { name: next }));
  };
  const sub = el("div", { className: "sub" });
  const toggle = el("input", { type: "checkbox" });
  toggle.onchange = () => {
    const thermostat = devices.get(d.ieee).capabilities.includes("thermostat");
    const body = thermostat
      ? { action: "system_mode", value: toggle.checked ? "heat" : "off" }
      : { action: toggle.checked ? "on" : "off" };
    run(api(`/api/devices/${d.ieee}/command`, body).catch(e => {
      toggle.checked = !toggle.checked;
      throw e;
    }));
  };
  const sw = el("label", { className: "switch", hidden: true }, toggle, el("span"));
  card.append(el("div", { className: "top" }, el("div", { className: "names" }, name, sub), sw));

  const values = el("div", { className: "values" });
  card.append(values);

  const level = el("input", { type: "range", min: 1, max: 254 });
  const levelText = el("span");
  level.oninput = () => levelText.textContent = `%${Math.round(level.value / 2.54)}`;
  level.onchange = () => run(api(`/api/devices/${d.ieee}/command`, { action: "level", value: Number(level.value) }));
  const levelRow = el("label", { className: "slider", hidden: true }, "Parlaklık", level, levelText);

  const ct = el("input", { type: "range" });
  const ctText = el("span");
  ct.oninput = () => ctText.textContent = `${Math.round(1e6 / ct.value / 100) * 100}K`;
  ct.onchange = () => run(api(`/api/devices/${d.ieee}/command`, { action: "color_temp", value: Number(ct.value) }));
  const ctRow = el("label", { className: "slider", hidden: true }, "Renk", ct, ctText);
  // Hedef sıcaklık: art arda tıklamalar tek komutta birleşir
  const target = el("span", { className: "target" });
  let pendingSetpoint = null, setpointTimer = null;
  const showSetpoint = (v) => target.textContent = v == null ? "–" : `${v.toFixed(1)} °C`;
  const stepSetpoint = (dir) => {
    const current = devices.get(d.ieee);
    const [min, max, step] = current.setpoint_range || [5, 35, 0.5];
    const base = pendingSetpoint ?? current.state.setpoint ?? 20;
    pendingSetpoint = Math.min(max, Math.max(min, Math.round((base + dir * step) / step) * step));
    showSetpoint(pendingSetpoint);
    clearTimeout(setpointTimer);
    setpointTimer = setTimeout(() => {
      const value = pendingSetpoint;
      run(api(`/api/devices/${d.ieee}/command`, { action: "setpoint", value }).finally(() => { pendingSetpoint = null; }));
    }, 800);
  };
  const minus = el("button", { className: "step", textContent: "−", title: "Azalt" });
  const plus = el("button", { className: "step", textContent: "+", title: "Artır" });
  minus.onclick = () => stepSetpoint(-1);
  plus.onclick = () => stepSetpoint(1);
  const preset = el("select", {},
    el("option", { value: "manual", textContent: "Manuel" }),
    el("option", { value: "program", textContent: "Program" }));
  preset.onchange = () => run(api(`/api/devices/${d.ieee}/command`, { action: "preset", value: preset.value }));
  const frost = el("input", { type: "checkbox" });
  frost.onchange = () => run(api(`/api/devices/${d.ieee}/command`, { action: "frost", value: frost.checked }));
  const thermoRow = el("div", { className: "thermo", hidden: true }, minus, target, plus, preset,
    el("label", { className: "check" }, frost, "Donma koruması"));
  const isPending = () => pendingSetpoint != null;
  card.append(levelRow, ctRow, thermoRow);

  const chips = el("div", { className: "chips" });
  card.append(chips);

  const reinterview = el("button", { textContent: "Yeniden tanı" });
  reinterview.onclick = () => run(api(`/api/devices/${d.ieee}/interview`).then(r => toast(r.waiting_for_wake
    ? "Pilli cihaz: düğmesine kısa basarak uyandır, tanıma o an başlayacak."
    : "Cihaz yeniden tanınıyor.")));
  const remove = el("button", { textContent: "Kaldır" });
  remove.onclick = () => {
    const current = devices.get(d.ieee);
    if (confirm(`"${current.name}" ağdan çıkarılsın mı?`)) run(api(`/api/devices/${d.ieee}`, null, "DELETE"));
  };
  const info = el("dl", { className: "info" });
  const settings = el("div");
  card.append(el("details", { className: "more" },
    el("summary", { textContent: "Ayrıntılar" }),
    info, settings,
    el("div", { className: "menu" }, reinterview, remove)));

  return { info, settings, settingRows: new Map(), card, name, sub, sw, toggle, values, level, levelText, levelRow, ct, ctText, ctRow, chips,
    thermoRow, showSetpoint, isPending, preset, frost };
}

function updateCard(parts, d) {
  const s = d.state, c = d.capabilities;
  parts.name.textContent = d.name;
  parts.sub.textContent = [d.manufacturer, d.model].filter(Boolean).join(" · ") || d.ieee;

  const thermostat = c.includes("thermostat");
  parts.sw.hidden = !c.includes("on_off") && !thermostat;
  if (document.activeElement !== parts.toggle) parts.toggle.checked = thermostat ? s.system_mode === "heat" : !!s.on;

  parts.thermoRow.hidden = !thermostat;
  if (thermostat) {
    if (!parts.isPending()) parts.showSetpoint(s.setpoint);
    if (document.activeElement !== parts.preset && s.preset) parts.preset.value = s.preset;
    if (document.activeElement !== parts.frost) parts.frost.checked = !!s.frost;
  }

  parts.levelRow.hidden = !c.includes("level");
  if (document.activeElement !== parts.level && s.level != null) {
    parts.level.value = s.level;
    parts.level.oninput();
  }

  parts.ctRow.hidden = !c.includes("color_temp");
  parts.ct.min = d.color_temp_min || 153;
  parts.ct.max = d.color_temp_max || 500;
  if (document.activeElement !== parts.ct && s.color_temp != null) {
    parts.ct.value = s.color_temp;
    parts.ct.oninput();
  }

  parts.values.replaceChildren(...sensorValues(d));

  const kind = d.router ? "Yönlendirici (şebeke)" : d.rx_on_when_idle ? "Uç cihaz" : "Pilli uç cihaz (uyuyan)";
  const rows = [
    ["IEEE", d.ieee],
    ["Ağ adresi", "0x" + d.nwk.toString(16).padStart(4, "0")],
    ["Üretici", d.manufacturer],
    ["Model", d.model],
    ["Yazılım", d.firmware],
    ["Tür", kind],
    ["Pil voltajı", s.voltage != null ? `${s.voltage.toFixed(1)} V` : null],
  ].filter(([, v]) => v != null && v !== "");
  parts.info.replaceChildren(...rows.flatMap(([k, v]) => [el("dt", { textContent: k }), el("dd", { textContent: v })]));
  updateSettings(parts, d);

  const chips = [];
  if (s.heating) chips.push(el("span", { className: "chip heat", textContent: "Isıtıyor" }));
  else if (thermostat && s.heating === false) chips.push(el("span", { className: "chip", textContent: "Beklemede" }));
  if (d.interviewing) chips.push(el("span", { className: "chip", textContent: "Tanınıyor…" }));
  else if (d.waiting_for_wake) chips.push(el("span", { className: "chip warn", textContent: "Uyanınca tanınacak" }));
  else if (!d.interviewed) chips.push(el("span", { className: "chip warn", textContent: "Tanınamadı" }));
  if (s.battery != null) chips.push(el("span", { className: "chip" + (s.battery < 15 ? " warn" : ""), textContent: `Pil %${s.battery}` }));
  if (s.battery_low) chips.push(el("span", { className: "chip warn", textContent: "Pil zayıf" }));
  if (d.lqi != null) chips.push(el("span", { className: "chip", textContent: `Sinyal ${d.lqi}` }));
  chips.push(el("span", { className: "chip", textContent: ago(d.last_seen) }));
  parts.chips.replaceChildren(...chips);
}

function updateSettings(parts, d) {
  for (const def of d.settings_schema || []) {
    let row = parts.settingRows.get(def.key);
    if (!row) {
      const input = el("input", { type: "number", min: def.min, max: def.max, step: def.step });
      const save = el("button", { textContent: "Kaydet" });
      const note = el("div", { className: "note", hidden: true, textContent: "Cihaz uyanınca uygulanacak (hemen uygulamak için cihazın düğmesine kısa bas)." });
      save.onclick = () => {
        const value = Number(input.value);
        run(api(`/api/devices/${d.ieee}/setting`, { key: def.key, value }).then(r => {
          if (!r.pending) toast(`${def.label} kaydedildi`);
        }));
      };
      row = { input, note };
      parts.settingRows.set(def.key, row);
      parts.settings.append(el("div", { className: "setting" },
        el("span", { textContent: `${def.label} (${def.unit})` }), input, save, note));
    }
    const current = d.settings?.[def.key];
    if (document.activeElement !== row.input && current != null) row.input.value = current;
    row.note.hidden = !(d.pending_settings || []).includes(def.key);
  }
}

function render() {
  const sorted = [...devices.values()].sort((a, b) => a.name.localeCompare(b.name, "tr"));
  const groups = { climate: [], lights: [], sensors: [], other: [] };
  for (const d of sorted) {
    let parts = cards.get(d.ieee);
    if (!parts) {
      parts = buildCard(d);
      cards.set(d.ieee, parts);
    }
    updateCard(parts, d);
    groups[group(d)].push(parts.card);
  }
  for (const [id, list] of Object.entries(groups)) {
    const container = $("#" + id);
    if (list.length === 0 && (id === "lights" || id === "sensors")) {
      container.replaceChildren(el("div", { className: "empty", textContent: id === "lights" ? "Henüz ışık yok." : "Henüz sensör yok." }));
    } else {
      container.replaceChildren(...list);
    }
  }
  $("#otherTitle").hidden = groups.other.length === 0;
  $("#climateTitle").hidden = groups.climate.length === 0;
}

function renderPermit() {
  const button = $("#permit");
  const left = Math.max(0, Math.round((permitUntil - Date.now()) / 1000));
  if (left > 0) {
    button.textContent = `Eşleştirme açık · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} (durdur)`;
    button.classList.remove("primary");
  } else {
    button.textContent = "Cihaz ekle";
    button.classList.add("primary");
  }
}

$("#permit").onclick = () => {
  const open = permitUntil > Date.now();
  run(api("/api/permit_join", { seconds: open ? 0 : 180 }).then(() => {
    if (!open) toast("Eşleştirme açık. Cihazı eşleştirme moduna al.");
  }));
};

async function load() {
  const state = await api("/api/state", null, "GET");
  devices.clear();
  for (const d of state.devices) devices.set(d.ieee, d);
  for (const ieee of [...cards.keys()]) if (!devices.has(ieee)) cards.delete(ieee);
  permitUntil = Date.now() + state.permit_join * 1000;
  render();
  renderPermit();
}

function connect() {
  const source = new EventSource("/api/events");
  source.onopen = () => {
    $("#conn").textContent = "bağlı";
    $("#conn").classList.remove("off");
    run(load());
  };
  source.onerror = () => {
    $("#conn").textContent = "bağlantı koptu, yeniden deneniyor…";
    $("#conn").classList.add("off");
  };
  source.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === "device") {
      devices.set(event.device.ieee, event.device);
      render();
    } else if (event.type === "removed") {
      devices.delete(event.ieee);
      cards.delete(event.ieee);
      render();
    } else if (event.type === "permit_join") {
      permitUntil = Date.now() + event.remaining * 1000;
      renderPermit();
    }
  };
}

setInterval(() => { renderPermit(); render(); }, 1000 * 15);
setInterval(renderPermit, 1000);
connect();
</script>
</body>
</html>
