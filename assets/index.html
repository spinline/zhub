<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee Merkezi</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d22; --muted: #6b7180;
    --line: #e3e5ea; --accent: #2f6fed; --accent-soft: #e6eeff;
    --warn: #c2410c; --ok: #15803d; --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1c1f25; --text: #e8eaee; --muted: #9aa0ad;
      --line: #2b2f37; --accent: #6d9bff; --accent-soft: #1f2a44;
      --warn: #fb923c; --ok: #4ade80; --chip: #262a32;
    }
  }
  * { box-sizing: border-box; }
  /* display kuralları hidden özniteliğini ezmesin */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #conn { font-size: 13px; color: var(--muted); }
  #conn.off { color: var(--warn); }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .top { display: flex; align-items: flex-start; gap: 10px; }
  .names { flex: 1; min-width: 0; }
  .name { font-weight: 600; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
  .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
  .chip.warn { color: var(--warn); }
  .values { display: flex; gap: 16px; flex-wrap: wrap; }
  .value b { font-size: 22px; font-weight: 600; }
  .value span { display: block; font-size: 12px; color: var(--muted); }
  .value.alert b { color: var(--warn); }
  label.slider { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer;
  }
  .switch span::before {
    content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .thermo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .thermo .target { font-size: 26px; font-weight: 600; min-width: 92px; text-align: center; }
  .thermo button.step { width: 40px; height: 40px; padding: 0; font-size: 20px; border-radius: 50%; }
  .thermo select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .chip.heat { color: #fff; background: var(--warn); }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  details.more { border-top: 1px solid var(--line); padding-top: 8px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 8px 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; }
  .setting { display: grid; grid-template-columns: 1fr 90px auto; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .setting input { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .setting .note { grid-column: 1 / -1; color: var(--warn); font-size: 12px; }
  .schedule { margin: 8px 0; }
  .schedule h4 { font-size: 13px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  .slot { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  .slot input { font: inherit; width: 100%; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .slot span { color: var(--muted); }
  .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .ctl > span { color: var(--muted); }
  .ctl select, .ctl input[type=number] { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .ctl .row { display: flex; gap: 6px; align-items: center; }
  .ctl input[type=number] { width: 90px; }
  .ctl .note { grid-column: 1 / -1; color: var(--warn); font-size: 12px; }
  details.more h4 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); font-weight: 600; }
  .menu { display: flex; gap: 8px; margin-top: 10px; }
  .menu button { padding: 4px 10px; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Zigbee Merkezi</h1>
  <span id="conn">bağlanıyor…</span>
  <button id="permit" class="primary">Cihaz ekle</button>
</header>
<main>
  <h2 id="climateTitle" hidden>Termostatlar</h2>
  <div id="climate" class="grid"></div>
  <h2>Işıklar</h2>
  <div id="lights" class="grid"></div>
  <h2>Sensörler</h2>
  <div id="sensors" class="grid"></div>
  <h2 id="otherTitle" hidden>Diğer</h2>
  <div id="other" class="grid"></div>
  <h2>Araçlar</h2>
  <div class="grid">
    <div class="card">
      <b>Hue lambayı seri numarasıyla sıfırla</b>
      <div class="sub" style="white-space:normal">Lambanın üzerindeki 6 haneli numara (0-9, A-F). Birden fazlası için virgülle ayır. Lamba açık olmalı; sıfırlanınca kendiliğinden ağa katılır. İşlem ~20 sn sürer.</div>
      <div class="setting" style="grid-template-columns:1fr auto">
        <input id="hueSerials" placeholder="ör. A1B2C3" autocomplete="off">
        <button id="hueReset">Sıfırla</button>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
const devices = new Map();
const cards = new Map();
let permitUntil = 0;

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(c => c != null));
  return node;
};

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(path, body, method = "POST") {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const run = (promise) => promise.catch(e => toast(e.message));

function ago(ts) {
  if (!ts) return "hiç görülmedi";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 60) return "az önce";
  if (s < 3600) return `${Math.floor(s / 60)} dk önce`;
  if (s < 86400) return `${Math.floor(s / 3600)} sa önce`;
  return `${Math.floor(s / 86400)} gün önce`;
}

// ---- Özellik yardımcıları ----

const LABELS = {
  off: "Kapalı", heat: "Isıt", auto: "Otomatik", manual: "Manuel", program: "Program",
  "5_2": "5+2 gün", "6_1": "6+1 gün", "7": "7 gün",
  local_temperature: "Dahili sensör", remote_temperature: "Harici sensör",
  remote_source_offline: "Harici sensör (çevrimdışı)", boost: "Boost", timer: "Zamanlayıcı",
};
const tr = (v) => LABELS[v] ?? v;

// IAS bölge türleri: [ad, alarm var, alarm yok]
const ZONES = { 0x15: ["Kapı/pencere", "Açık", "Kapalı"], 0x0D: ["Hareket", "Algılandı", "Yok"], 0x2A: ["Su", "Sızıntı!", "Kuru"], 0x28: ["Duman", "Alarm!", "Normal"] };

const feature = (d, key) => d.features.find(f => f.key === key);
const writable = (f) => f && f.access === "read_write";

function featureLabel(f, d) {
  if (f.key === "alarm" && ZONES[d.state.zone_type]) return ZONES[d.state.zone_type][0];
  return f.label;
}

function formatValue(f, v, d) {
  if (v == null) return "–";
  const k = f.kind;
  if (k.type === "binary") {
    if (f.key === "alarm") {
      const z = ZONES[d.state.zone_type];
      return z ? (v ? z[1] : z[2]) : (v ? "Etkin" : "Normal");
    }
    return v ? "Evet" : "Hayır";
  }
  if (k.type === "enum") return tr(v);
  if (k.type === "numeric") {
    const n = Number(v);
    const text = Number.isInteger(n) ? String(n) : n.toFixed(1);
    return k.unit ? `${text} ${k.unit}` : text;
  }
  return String(v);
}

// Aralık: tanımdaki sınırlar, cihazın bildirdikleriyle daraltılmış
function range(f, d) {
  const k = f.kind;
  let min = k.min, max = k.max;
  if (k.range_keys) {
    const [lo, hi] = k.range_keys;
    if (d.state[lo] != null) min = min == null ? d.state[lo] : Math.max(min, d.state[lo]);
    if (d.state[hi] != null) max = max == null ? d.state[hi] : Math.min(max, d.state[hi]);
  }
  return [min, max, k.step ?? 1];
}

function setValue(ieee, key, value) {
  return api(`/api/devices/${ieee}/set`, { key, value }).then(r => {
    if (r.pending) toast("Cihaz uyanınca uygulanacak (hemen uygulamak için cihazın düğmesine kısa bas).");
    return r;
  });
}

const focused = (...nodes) => nodes.includes(document.activeElement);

// ---- Denetimler: her biri {node, update(d)} ----

function valueTile(key) {
  const b = el("b"), span = el("span");
  const node = el("div", { className: "value" }, b, span);
  return {
    node,
    update(d) {
      const f = feature(d, key), v = d.state[key];
      node.hidden = !f || v == null;
      if (!f) return;
      b.textContent = formatValue(f, v, d);
      span.textContent = featureLabel(f, d);
      node.classList.toggle("alert", f.kind.type === "binary" && !!v && ["alarm", "occupancy"].includes(key));
    },
  };
}

function pendingNote(key) {
  const node = el("div", { className: "note", hidden: true, textContent: "Cihaz uyanınca uygulanacak" });
  return { node, update(d) { node.hidden = !(d.pending || []).includes(key); } };
}

// Ayrıntılar'daki genel denetim: türüne göre anahtar, seçim, sayı ya da salt değer
function control(ieee, f) {
  const note = pendingNote(f.key);
  const title = el("span", { textContent: f.kind.unit ? `${f.label} (${f.kind.unit})` : f.label });
  if (f.access !== "read_write") {
    const out = el("b", { style: "font-weight:500" });
    return {
      node: el("div", { className: "ctl" }, title, out),
      update(d) { out.textContent = formatValue(f, d.state[f.key], d); title.textContent = featureLabel(f, d); },
    };
  }
  if (f.kind.type === "binary") {
    const input = el("input", { type: "checkbox" });
    input.onchange = () => run(setValue(ieee, f.key, input.checked).catch(e => { input.checked = !input.checked; throw e; }));
    return {
      node: el("div", { className: "ctl" }, title, el("label", { className: "switch" }, input, el("span")), note.node),
      update(d) { if (!focused(input)) input.checked = !!d.state[f.key]; note.update(d); },
    };
  }
  if (f.kind.type === "enum") {
    const select = el("select", {}, ...f.kind.values.map(v => el("option", { value: v, textContent: tr(v) })));
    select.onchange = () => run(setValue(ieee, f.key, select.value));
    return {
      node: el("div", { className: "ctl" }, title, select, note.node),
      update(d) { if (!focused(select) && d.state[f.key] != null) select.value = d.state[f.key]; note.update(d); },
    };
  }
  if (f.kind.type === "numeric") {
    const input = el("input", { type: "number" });
    const save = el("button", { textContent: "Kaydet" });
    let last;
    save.onclick = () => run(setValue(ieee, f.key, Number(input.value)).then(r => { if (!r.pending) toast(`${f.label} kaydedildi`); }));
    return {
      node: el("div", { className: "ctl" }, title, el("div", { className: "row" }, input, save), note.node),
      update(d) {
        const [min, max, step] = range(f, d);
        Object.assign(input, { min: min ?? "", max: max ?? "", step });
        // Kaydedilmemiş girişi ezme: yalnızca cihazın değeri değiştiyse güncelle
        const v = d.state[f.key];
        if (!focused(input) && v !== last) { input.value = v ?? ""; last = v; }
        note.update(d);
      },
    };
  }
  if (f.kind.type === "schedule") return scheduleControl(ieee, f);
  return { node: el("div"), update() {} };
}

// Haftalık program: dilim sayısı cihazın bildirdiği düzende sabit
function scheduleControl(ieee, f) {
  const box = el("div", { className: "schedule" });
  let inputs = [], last;
  const groups = (d, n) => d.state.working_week === "5_2" && n === 8
    ? [["Hafta içi (Pzt–Cum)", 0, 6], ["Hafta sonu (Cmt–Paz)", 6, 8]]
    : [["Dilimler", 0, n]];
  return {
    node: box,
    update(d) {
      const slots = d.state[f.key];
      const json = JSON.stringify(slots);
      if (!Array.isArray(slots) || json === last) return;
      last = json;
      const [min, max, step] = [f.kind.min, f.kind.max, f.kind.step];
      const rows = [];
      inputs = [];
      for (const [title, from, to] of groups(d, slots.length)) {
        rows.push(el("h4", { textContent: title }));
        for (let i = from; i < to; i++) {
          const time = el("input", { type: "time", value: slots[i].time });
          const temp = el("input", { type: "number", min, max, step, value: slots[i].temperature });
          inputs.push({ time, temp });
          rows.push(el("div", { className: "slot" }, el("span", { textContent: `${i - from + 1}.` }), time, temp));
        }
      }
      const save = el("button", { textContent: "Programı kaydet" });
      save.onclick = () => {
        const value = inputs.map(({ time, temp }) => ({ time: time.value, temperature: Number(temp.value) }));
        run(setValue(ieee, f.key, value).then(() => toast("Program gönderildi")));
      };
      box.replaceChildren(el("h4", { textContent: `${f.label} (saat · °C)` }), ...rows, save);
    },
  };
}

// ---- Kartlar ----

function lightControls(ieee) {
  const level = el("input", { type: "range", min: 1, max: 254 });
  const levelText = el("span");
  level.oninput = () => levelText.textContent = `%${Math.round(level.value / 2.54)}`;
  level.onchange = () => run(setValue(ieee, "level", Number(level.value)));
  const levelRow = el("label", { className: "slider" }, "Parlaklık", level, levelText);

  const ct = el("input", { type: "range" });
  const ctText = el("span");
  ct.oninput = () => ctText.textContent = `${Math.round(1e6 / ct.value / 100) * 100}K`;
  ct.onchange = () => run(setValue(ieee, "color_temp", Number(ct.value)));
  const ctRow = el("label", { className: "slider" }, "Renk", ct, ctText);

  return {
    node: el("div", {}, levelRow, ctRow),
    update(d) {
      levelRow.hidden = !writable(feature(d, "level"));
      if (!focused(level) && d.state.level != null) { level.value = d.state.level; level.oninput(); }
      const f = feature(d, "color_temp");
      ctRow.hidden = !writable(f);
      if (f) {
        const [min, max] = range(f, d);
        Object.assign(ct, { min: min ?? 153, max: max ?? 500 });
        if (!focused(ct) && d.state.color_temp != null) { ct.value = d.state.color_temp; ct.oninput(); }
      }
    },
  };
}

function thermostatControls(ieee) {
  const room = valueTile("temperature");
  const target = el("span", { className: "target" });
  let pending = null, timer = null;
  const show = (v) => target.textContent = v == null ? "–" : `${Number(v).toFixed(1)} °C`;
  let current = {};
  const step = (dir) => {
    const f = feature(current, "setpoint");
    const [min, max, stepSize] = range(f, current);
    const base = pending ?? current.state.setpoint ?? 20;
    pending = Math.min(max ?? 99, Math.max(min ?? 0, Math.round((base + dir * stepSize) / stepSize) * stepSize));
    show(pending);
    // Art arda tıklamalar tek komutta birleşir
    clearTimeout(timer);
    timer = setTimeout(() => {
      const value = pending;
      run(setValue(ieee, "setpoint", value).finally(() => { pending = null; }));
    }, 800);
  };
  const minus = el("button", { className: "step", textContent: "−", title: "Azalt" });
  const plus = el("button", { className: "step", textContent: "+", title: "Artır" });
  minus.onclick = () => step(-1);
  plus.onclick = () => step(1);
  const setpointRow = el("div", { className: "thermo" }, minus, target, plus);
  return {
    node: el("div", {}, el("div", { className: "values" }, room.node), setpointRow),
    update(d) {
      current = d;
      room.update(d);
      setpointRow.hidden = !writable(feature(d, "setpoint"));
      if (pending == null) show(d.state.setpoint);
    },
  };
}

// Kart düzeninin kullandığı anahtarlar; geri kalan "kart" özellikleri genel denetim alır
const CONSUMED = {
  light: ["on", "level", "color_temp"],
  thermostat: ["temperature", "setpoint", "heating"],
  sensor: [],
  generic: [],
};
const CHIP_KEYS = ["battery", "battery_low", "fault"];

function buildCard(d) {
  const ieee = d.ieee;
  const updaters = [];
  const card = el("div", { className: "card" });

  const name = el("button", { className: "name", title: "Yeniden adlandır" });
  name.onclick = () => {
    const current = devices.get(ieee);
    const next = prompt("Cihazın adı", current.name);
    if (next && next.trim() && next !== current.name) run(api(`/api/devices/${ieee}/rename`, { name: next }));
  };
  const sub = el("div", { className: "sub" });
  const top = el("div", { className: "top" }, el("div", { className: "names" }, name, sub));
  card.append(top);

  // Işıkta başlıkta aç/kapa anahtarı
  if (d.card === "light" && writable(feature(d, "on"))) {
    const toggle = el("input", { type: "checkbox" });
    toggle.onchange = () => run(setValue(ieee, "on", toggle.checked).catch(e => { toggle.checked = !toggle.checked; throw e; }));
    top.append(el("label", { className: "switch" }, toggle, el("span")));
    updaters.push(d => { if (!focused(toggle)) toggle.checked = !!d.state.on; });
  }
  if (d.card === "light") {
    const c = lightControls(ieee); card.append(c.node); updaters.push(c.update);
  }
  if (d.card === "thermostat") {
    const c = thermostatControls(ieee); card.append(c.node); updaters.push(c.update);
  }

  // Kalan "kart" özellikleri: salt okunurlar değer olarak, yazılabilirler denetim olarak
  const consumed = new Set([...(CONSUMED[d.card] || []), ...CHIP_KEYS]);
  const cardFeatures = d.features.filter(f => f.place === "card" && !consumed.has(f.key));
  const tiles = cardFeatures.filter(f => !writable(f)).map(f => valueTile(f.key));
  if (tiles.length) {
    card.append(el("div", { className: "values" }, ...tiles.map(t => t.node)));
    tiles.forEach(t => updaters.push(t.update));
  }
  for (const f of cardFeatures.filter(writable)) {
    const c = control(ieee, f); card.append(c.node); updaters.push(c.update);
  }

  const chips = el("div", { className: "chips" });
  card.append(chips);
  updaters.push(d => chips.replaceChildren(...chipList(d)));

  // Ayrıntılar: bilgi, ayarlar, tanı
  const info = el("dl", { className: "info" });
  updaters.push(d => info.replaceChildren(...infoRows(d)));
  const config = d.features.filter(f => f.place === "config").map(f => control(ieee, f));
  const diagnostic = d.features.filter(f => f.place === "diagnostic").map(f => control(ieee, f));
  [...config, ...diagnostic].forEach(c => updaters.push(c.update));

  const reinterview = el("button", { textContent: "Yeniden tanı" });
  reinterview.onclick = () => run(api(`/api/devices/${ieee}/interview`).then(r => toast(r.waiting_for_wake
    ? "Pilli cihaz: düğmesine kısa basarak uyandır, tanıma o an başlayacak."
    : "Cihaz yeniden tanınıyor.")));
  const remove = el("button", { textContent: "Kaldır" });
  remove.onclick = () => {
    const current = devices.get(ieee);
    if (confirm(`"${current.name}" ağdan çıkarılsın mı?`)) run(api(`/api/devices/${ieee}`, null, "DELETE"));
  };
  card.append(el("details", { className: "more" },
    el("summary", { textContent: "Ayrıntılar" }),
    info,
    config.length ? el("h4", { textContent: "Ayarlar" }) : null, ...config.map(c => c.node),
    diagnostic.length ? el("h4", { textContent: "Tanı" }) : null, ...diagnostic.map(c => c.node),
    el("div", { className: "menu" }, reinterview, remove)));

  updaters.push(d => {
    name.textContent = d.name;
    sub.textContent = [d.manufacturer, d.model].filter(Boolean).join(" · ") || d.ieee;
  });

  return { card, update: (d) => updaters.forEach(u => u(d)) };
}

function chipList(d) {
  const s = d.state, chips = [];
  const chip = (text, cls = "") => el("span", { className: `chip ${cls}`, textContent: text });
  if (d.interviewing) chips.push(chip("Tanınıyor…"));
  else if (d.waiting_for_wake) chips.push(chip("Uyanınca tanınacak", "warn"));
  else if (!d.interviewed) chips.push(chip("Tanınamadı", "warn"));
  if (feature(d, "heating") && s.heating != null) chips.push(s.heating ? chip("Isıtıyor", "heat") : chip("Beklemede"));
  if (s.fault) chips.push(chip(`Arıza kodu ${s.fault}`, "warn"));
  if (s.battery != null) chips.push(chip(`Pil %${Math.round(s.battery)}`, s.battery < 15 ? "warn" : ""));
  if (s.battery_low) chips.push(chip("Pil zayıf", "warn"));
  if ((d.pending || []).length) chips.push(chip("Ayar bekliyor", "warn"));
  if (d.rssi != null) chips.push(el("span", { className: "chip" + (d.rssi < -80 ? " warn" : ""), textContent: `Sinyal ${d.rssi} dBm`, title: `LQI ${d.lqi ?? "?"}` }));
  chips.push(chip(ago(d.last_seen)));
  return chips;
}

function infoRows(d) {
  const kind = d.router ? "Yönlendirici (şebeke)" : d.rx_on_when_idle ? "Uç cihaz" : "Pilli uç cihaz (uyuyan)";
  return [
    ["IEEE", d.ieee],
    ["Ağ adresi", "0x" + d.nwk.toString(16).padStart(4, "0")],
    ["Üretici", d.manufacturer],
    ["Model", d.model],
    ["Yazılım", d.firmware],
    ["Tür", kind],
  ].filter(([, v]) => v != null && v !== "")
    .flatMap(([k, v]) => [el("dt", { textContent: k }), el("dd", { textContent: v })]);
}

const GROUPS = { thermostat: "climate", light: "lights", sensor: "sensors", generic: "other" };

// Tanım değişirse (ör. tanıma sonrası model öğrenildi) kart baştan kurulur
const signature = (d) => d.card + "|" + d.features.map(f => f.key + f.access + f.place).join(",");

function render() {
  const sorted = [...devices.values()].sort((a, b) => a.name.localeCompare(b.name, "tr"));
  const groups = { climate: [], lights: [], sensors: [], other: [] };
  for (const d of sorted) {
    let entry = cards.get(d.ieee);
    if (!entry || entry.signature !== signature(d)) {
      entry = { ...buildCard(d), signature: signature(d) };
      cards.set(d.ieee, entry);
    }
    entry.update(d);
    groups[GROUPS[d.card] || "other"].push(entry.card);
  }
  for (const [id, list] of Object.entries(groups)) {
    const container = $("#" + id);
    if (list.length === 0 && (id === "lights" || id === "sensors")) {
      container.replaceChildren(el("div", { className: "empty", textContent: id === "lights" ? "Henüz ışık yok." : "Henüz sensör yok." }));
    } else {
      container.replaceChildren(...list);
    }
  }
  $("#otherTitle").hidden = groups.other.length === 0;
  $("#climateTitle").hidden = groups.climate.length === 0;
}

function renderPermit() {
  const button = $("#permit");
  const left = Math.max(0, Math.round((permitUntil - Date.now()) / 1000));
  if (left > 0) {
    button.textContent = `Eşleştirme açık · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} (durdur)`;
    button.classList.remove("primary");
  } else {
    button.textContent = "Cihaz ekle";
    button.classList.add("primary");
  }
}

$("#permit").onclick = () => {
  const open = permitUntil > Date.now();
  run(api("/api/permit_join", { seconds: open ? 0 : 180 }).then(() => {
    if (!open) toast("Eşleştirme açık. Cihazı eşleştirme moduna al.");
  }));
};

$("#hueReset").onclick = () => {
  const serials = $("#hueSerials").value.split(/[\s,]+/).filter(Boolean);
  const button = $("#hueReset");
  button.disabled = true;
  button.textContent = "Gönderiliyor…";
  run(api("/api/hue_reset", { serials })
    .then(() => toast("Sıfırlama isteği gönderildi; lamba yanıp sönüp ağa katılmalı."))
    .finally(() => { button.disabled = false; button.textContent = "Sıfırla"; }));
};

async function load() {
  const state = await api("/api/state", null, "GET");
  devices.clear();
  for (const d of state.devices) devices.set(d.ieee, d);
  for (const ieee of [...cards.keys()]) if (!devices.has(ieee)) cards.delete(ieee);
  permitUntil = Date.now() + state.permit_join * 1000;
  render();
  renderPermit();
}

function connect() {
  const source = new EventSource("/api/events");
  source.onopen = () => {
    $("#conn").textContent = "bağlı";
    $("#conn").classList.remove("off");
    run(load());
  };
  source.onerror = () => {
    $("#conn").textContent = "bağlantı koptu, yeniden deneniyor…";
    $("#conn").classList.add("off");
  };
  source.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === "device") {
      devices.set(event.device.ieee, event.device);
      render();
    } else if (event.type === "removed") {
      devices.delete(event.ieee);
      cards.delete(event.ieee);
      render();
    } else if (event.type === "permit_join") {
      permitUntil = Date.now() + event.remaining * 1000;
      renderPermit();
    }
  };
}

setInterval(() => { renderPermit(); render(); }, 1000 * 15);
setInterval(renderPermit, 1000);
connect();
</script>
</body>
