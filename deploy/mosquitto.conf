# MQTT broker for zhub (Zigbee hub) and the automation side (Home Assistant/Homey).
# Original reference config: mosquitto.conf.orig
# Home network and zhub only (not the guest network or VPN interfaces).
user nobody
listener 1883 192.168.1.1
listener 1883 127.0.0.1
allow_anonymous false
# Plaintext passwords (this build has no TLS/hashing): readable by the broker user only
password_file /opt/etc/mosquitto/passwd
persistence true
persistence_location /opt/var/lib/mosquitto/
log_dest file /opt/var/log/mosquitto.log
log_type error
log_type warning
connection_messages false
